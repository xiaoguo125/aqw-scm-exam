<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>奥琦玮供应链随堂测试</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#f5f7fa;color:#333;min-height:100vh}
.container{max-width:800px;margin:0 auto;padding:20px}
.card{background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.1);padding:30px;margin-bottom:20px}
h1{font-size:24px;text-align:center;color:#1890ff;margin-bottom:30px}
.form-group{margin-bottom:20px}
.form-group label{display:block;margin-bottom:8px;font-weight:500}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:12px 16px;border:1px solid #e8e8e8;border-radius:8px;font-size:16px}
.form-group input:focus,.form-group textarea:focus{outline:none;border-color:#1890ff}
.btn{display:inline-block;padding:12px 24px;border:none;border-radius:8px;font-size:16px;cursor:pointer;transition:all .3s;text-align:center;text-decoration:none}
.btn-primary{background:#1890ff;color:#fff}
.btn-primary:hover{background:#40a9ff}
.btn-secondary{background:#fff;color:#333;border:1px solid #e8e8e8}
.btn-secondary:hover{border-color:#1890ff;color:#1890ff}
.btn-danger{background:#ff4d4f;color:#fff}
.btn:disabled{opacity:.6;cursor:not-allowed}
.exam-header{text-align:center;margin-bottom:30px}
.exam-info{display:flex;justify-content:center;gap:20px;margin:20px 0;flex-wrap:wrap}
.exam-info span{background:#e6f7ff;color:#1890ff;padding:8px 16px;border-radius:20px;font-size:14px}
.progress-bar{background:#e8e8e8;height:8px;border-radius:4px;margin-bottom:20px;overflow:hidden}
.progress-bar .progress{background:#1890ff;height:100%;transition:width .3s}
.question-card{background:#fff;border-radius:12px;padding:24px;margin-bottom:20px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.question-number{display:inline-block;background:#1890ff;color:#fff;width:28px;height:28px;line-height:28px;text-align:center;border-radius:50%;font-size:14px;margin-right:10px}
.question-text{font-size:16px;line-height:1.6}
.options{display:flex;flex-direction:column;gap:12px}
.option{display:flex;align-items:center;padding:16px;border:2px solid #e8e8e8;border-radius:10px;cursor:pointer;transition:all .3s}
.option:hover{border-color:#1890ff;background:#f0f7ff}
.option.selected{border-color:#1890ff;background:#e6f7ff}
.option-letter{width:32px;height:32px;line-height:32px;text-align:center;border-radius:50%;background:#e8e8e8;margin-right:12px;font-weight:600;flex-shrink:0}
.option.selected .option-letter{background:#1890ff;color:#fff}
.option-text{flex:1}
.exam-actions{display:flex;justify-content:space-between;margin-top:30px}
.result-card{text-align:center;padding:40px}
.score-big{font-size:72px;font-weight:bold;margin:20px 0}
.score-big.pass{color:#52c41a}
.score-big.fail{color:#ff4d4f}
.score-detail{display:flex;justify-content:center;gap:40px;margin:30px 0}
.score-detail div{text-align:center}
.score-detail .num{font-size:28px;font-weight:bold;color:#1890ff}
.score-detail .label{color:#666;font-size:14px;margin-top:5px}
.admin-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;padding-bottom:20px;border-bottom:1px solid #e8e8e8}
.admin-tabs{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.tab-btn{padding:10px 20px;border:1px solid #e8e8e8;background:#fff;border-radius:8px;cursor:pointer;transition:all .3s;font-size:14px}
.tab-btn.active{background:#1890ff;color:#fff;border-color:#1890ff}
.table{width:100%;border-collapse:collapse}
.table th,.table td{padding:12px;text-align:left;border-bottom:1px solid #e8e8e8}
.table th{background:#fafafa;font-weight:600}
.table tr:hover{background:#f5f5f5}
.badge{display:inline-block;padding:4px 8px;border-radius:4px;font-size:12px;background:#e6f7ff;color:#1890ff}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;margin:20px 0}
.stat-card{background:linear-gradient(135deg,#1890ff,#40a9ff);color:#fff;padding:24px;border-radius:12px;text-align:center}
.stat-card.green{background:linear-gradient(135deg,#52c41a,#73d13d)}
.stat-card.orange{background:linear-gradient(135deg,#faad14,#ffc53d)}
.stat-card .num{font-size:36px;font-weight:bold}
.stat-card .label{opacity:.9;margin-top:8px}
.modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:1000;align-items:center;justify-content:center}
.modal.show{display:flex}
.modal-content{background:#fff;border-radius:12px;padding:30px;max-width:600px;width:90%;max-height:90vh;overflow-y:auto}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.modal-close{width:32px;height:32px;border:none;background:none;font-size:24px;cursor:pointer}
.empty{text-align:center;padding:60px 20px;color:#666}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:12px 24px;border-radius:8px;z-index:2000;opacity:0;transition:opacity .3s}
.toast.show{opacity:1}
.toast.success{background:#52c41a}
.toast.error{background:#ff4d4f}
@media(max-width:600px){.container{padding:15px}.card{padding:20px}h1{font-size:20px}.exam-info{gap:10px}.score-detail{flex-direction:column;gap:20px}.stats-grid{grid-template-columns:1fr 1fr}}
</style>
</head>

<script>
(function(){
'use strict';

// 题库数据
var QUESTIONS = [
{id:1,m:1,q:"易企APP在哪里可以下载？",a:["手机应用商店","电脑官网","微信小程序"],n:0,e:"易企APP可在手机应用商店搜索下载"},

{id:17,m:3,q:"入库验收发现质量问题应？",a:["正常入库","拒绝入库并备注","自行处理"],n:1,e:"应拒绝入库并在系统中备注"},
{id:18,m:3,q:"供应商可在手机上操作什么？",a:["仅查看订单","接单/配送/查库存","所有功能"],n:1,e:"可接单、查看配送信息、查库存等"},
{id:19,m:4,q:"配送入库在哪里操作？",a:["门店APP","供应商后台","总部系统"],n:0,e:"由门店在易企APP中确认收货"},
{id:20,m:4,q:"配送入库发现包装破损应？",a:["正常入库","拍照留证后入库","拒收并投诉"],n:1,e:"拍照留证后在系统中备注再入库"},
{id:21,m:4,q:"入库少于配送数量时系统会？",a:["自动补货","自动生成退配单","自动罚款"],n:1,e:"自动生成退配单给供应商"},
{id:22,m:4,q:"退配单由谁处理？",a:["门店","供应商","物流公司"],n:1,e:"由供应商接收并处理退货"},

{id:24,m:4,q:"入库时间可在手机上改吗？",a:["可随意改","不可改","需申请审批"],n:2,e:"为系统自动记录，修改需走审批流程"},

{id:26,m:5,q:"委托收货需要设置什么？",a:["无需设置","设置委托关系","双方协议"],n:1,e:"需在系统中设置门店间委托关系"},
{id:27,m:5,q:"委托收货后货物归属谁？",a:["委托方门店","被委托方门店","总部统一管理"],n:0,e:"归属委托方门店，被委托方只是代收"},
{id:28,m:5,q:"委托收货的退货由谁操作？",a:["被委托方","委托方","供应商"],n:1,e:"由委托方门店发起操作"},
{id:29,m:5,q:"委托收货关系在哪设置？",a:["易企APP","PC后台系统","微信小程序"],n:1,e:"需在PC后台系统中配置"},
{id:30,m:6,q:"库存报损是什么操作？",a:["报备损失","减少库存数量","记录损耗"],n:1,e:"将实际减少的库存做记录"},
{id:31,m:6,q:"哪种情况需报损？",a:["正常销售","货品过期/损坏/丢失","正常盘点"],n:1,e:"过期、损坏、丢失等非正常减少需报损"},
{id:32,m:6,q:"库存报溢是什么操作？",a:["减少库存","增加库存数量","转移库存"],n:1,e:"将实际多出的库存增加记录"},
{id:33,m:6,q:"报损报溢需提供什么？",a:["无需凭证","图片或说明","领导签字"],n:1,e:"需上传图片或填写说明作为凭证"},
{id:34,m:6,q:"报损报溢单需审核吗？",a:["自动通过","需要审核","看金额大小"],n:1,e:"需相关人员审核后生效"},
{id:35,m:6,q:"报溢库存可随便加吗？",a:["可随意填","必须有实际依据","系统自动计算"],n:1,e:"必须有实际盘点数据作为依据"},
{id:36,m:7,q:"库存查询在APP哪里？",a:["首页","我的","库存模块"],n:2,e:"在易企APP的库存模块中"},
{id:37,m:7,q:"可以查哪些库存？",a:["只能查自己门店","绑定门店的库存","所有门店"],n:1,e:"可查自己绑定门店的库存数据"},
{id:38,m:7,q:"新建盘点单的前提是什么？",a:["随时可建","仓库必须有库存","必须报损后"],n:1,e:"仓库必须有期初数据或出入库记录"},
{id:39,m:7,q:"盘点发现数量少了怎么办？",a:["不记录","做报损","做报溢"],n:1,e:"需做报损处理"},
{id:40,m:7,q:"盘点完成后库存会怎样？",a:["不变","更新为盘点数量","清零"],n:1,e:"更新为实际盘点数量"},
{id:41,m:7,q:"可按什么条件筛选库存？",a:["只能按门店","按仓库/类别/供应商等","无法筛选"],n:1,e:"支持按仓库、类别、供应商等多条件筛选"},
{id:42,m:7,q:"库存查询能看到什么？",a:["只有数量","数量/金额/批次等","只有金额"],n:1,e:"可看到数量、金额、批次、保质期等信息"},
{id:43,m:8,q:"调拨和领用的区别是？",a:["没有区别","调拨是转移领用是消耗","调拨需审批领用不需"],n:1,e:"调拨是门店间库存转移，领用是消耗出库"},
{id:44,m:8,q:"店间调拨需几个门店操作？",a:["1个","2个","3个"],n:1,e:"需调出和调入双方都操作确认"},
{id:45,m:8,q:"领用单完成后会怎样？",a:["库存转移","库存减少","库存不变"],n:1,e:"库存会减少（消耗出库）"},
{id:46,m:8,q:"调拨单由谁发起？",a:["调出门店","调入门店","总部"],n:0,e:"由调出门店在APP中发起"},
{id:47,m:8,q:"调拨申请需审核吗？",a:["不需要","需调入门店确认","需总部审核"],n:1,e:"需调入门店确认后生效"},
{id:48,m:8,q:"领用单适用什么场景？",a:["门店间转移","内部领用消耗","退货给供应商"],n:1,e:"适用于内部领用消耗"},
{id:49,m:8,q:"调拨和领用可在APP上操作吗？",a:["只能PC端","可在APP操作","必须现场操作"],n:1,e:"都支持在易企APP中操作"},
{id:50,m:8,q:"调拨单库存立即变化吗？",a:["立即变化","对方确认后才变","次日生效"],n:1,e:"对方确认后库存才变化"},
{id:51,m:1,q:"APP登录后首页可自定义吗？",a:["不可以","可添加常用功能","只能系统设置"],n:1,e:"首页可添加常用功能快捷入口"},
{id:52,m:2,q:"订货单提交后发现错了能改吗？",a:["随时可改","审核前可改","不能改只能撤销"],n:1,e:"审核前可改，审核通过后不能改"},
{id:53,m:3,q:"入库单可以打印吗？",a:["不可以","可以打印","只能电子版"],n:1,e:"支持打印用于纸质存档"},
{id:54,m:4,q:"入库时可选择部分签收吗？",a:["不可以","按实际数量签收","必须全签收"],n:1,e:"按实际到货数量签收，差异生成退配单"},
{id:55,m:5,q:"委托收货货物存放在哪？",a:["委托方门店","被委托方仓库","总部仓库"],n:1,e:"存放在被委托方门店仓库"},
{id:56,m:6,q:"报损单审核不通过会怎样？",a:["库存自动修正","库存保持不变","需重新提交"],n:1,e:"库存保持不变"},
{id:57,m:7,q:"盘点可只盘部分货品吗？",a:["不可以","可按类别选择","必须全盘"],n:1,e:"支持按类别筛选只盘部分货品"},
{id:58,m:8,q:"调拨出去的货物还能用吗？",a:["可以","对方确认前不能","永久不能"],n:1,e:"对方确认前调出门店仍可用"},
{id:59,m:2,q:"订货模板的作用是什么？",a:["没有作用","快速添加常用货品","限制订货种类"],n:1,e:"快速添加常用货品提高效率"},
{id:60,m:7,q:"盘点差异指什么？",a:["不是","导入库存与实际库存差值","预期差异"],n:1,e:"系统导入数与实际盘点数的差值"}

var CONFIG = {t:'奥琦玮供应链随堂测试',n:20,p:5,s:80,pw:'Nc123456',tm:15,mx:3};
var STATE = {qs:[],eq:[],ci:0,an:{},nm:'',st:null,timer:null,rec:[],tab:'q'};
var MODULES = {1:'APP下载与登录',2:'门店订货操作',3:'采购入库/退货',4:'配送入库/退配',5:'委托收货/退回',6:'库存报损/报溢',7:'库存查询与盘点',8:'调拨与领用'};

function $(id){return document.getElementById(id)}
function shuffle(arr){var a=arr.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function getModule(m){return MODULES[m]||'未知'}
function toast(msg,type){type=type||'';var old=document.querySelector('.toast');if(old)old.parentNode.removeChild(old);var el=document.createElement('div');el.className='toast '+type;el.textContent=msg;document.body.appendChild(el);setTimeout(function(){el.className+=' show'},10);setTimeout(function(){el.className=el.className.replace(' show','');setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el)},300)},2500)}
function loadData(){try{var s=localStorage.getItem('sq_v4');if(s)STATE.qs=JSON.parse(s);else STATE.qs=QUESTIONS.slice();STATE.rec=JSON.parse(localStorage.getItem('sr_v4')||'[]');var c=localStorage.getItem('sc_v4');if(c){var oc=JSON.parse(c);for(var k in oc)if(oc[k]!==undefined&&oc[k]!==null)CONFIG[k]=oc[k]}}catch(e){STATE.qs=QUESTIONS.slice();STATE.rec=[]}}
function saveData(){try{localStorage.setItem('sq_v4',JSON.stringify(STATE.qs));localStorage.setItem('sr_v4',JSON.stringify(STATE.rec));localStorage.setItem('sc_v4',JSON.stringify(CONFIG))}catch(e){}}

function route(){var p=window.location.search;if(p.indexOf('mode=admin')!==-1)checkAdmin();else showStart()}

function showStart(){
  stopTimer();
  var remaining=getRemainingAttempts();
  var tmInfo=CONFIG.tm>0?'时间限制：'+CONFIG.tm+' 分钟':'时间限制：无限制';
  var ctInfo=CONFIG.mx>0?'考试次数：'+CONFIG.mx+' 次':'考试次数：无限制';
  var infoBadge='<div style="display:flex;justify-content:center;gap:15px;margin-bottom:20px;flex-wrap:wrap"><span style="background:#e6f7ff;color:#1890ff;padding:8px 16px;border-radius:20px;font-size:14px">'+tmInfo+'</span><span style="background:#f6ffed;color:#52c41a;padding:8px 16px;border-radius:20px;font-size:14px">'+ctInfo+'</span></div>';

window.startExam=function(){
  var v=($('nameInput')||{}).value||'';v=v.trim();
  if(!v){toast('请输入姓名','error');return}
  // Check remaining using the entered name
  if(CONFIG.mx>0){
    var cnt=0;
    for(var i=0;i<STATE.rec.length;i++){
      if(STATE.rec[i].nm===v)cnt++;
    }
    if(cnt>=CONFIG.mx){toast('考试次数已用完，无法再参加考试','error');return}
  }
  STATE.nm=v;STATE.eq=shuffle(STATE.qs.slice()).slice(0,CONFIG.n);STATE.an={};STATE.ci=0;STATE.st=new Date();startTimer();renderQuestion();
};

function getRemainingAttempts(){
  if(CONFIG.mx<=0)return-1;
  var name=($('nameInput')||{}).value||'';  // Get from input field instead
  if(!name)return-1;
  var cnt=0;
  for(var i=0;i<STATE.rec.length;i++){
    if(STATE.rec[i].nm===name)cnt++;
  }
  return CONFIG.mx-cnt;
}

function checkRemainingAttempts(name){
  if(CONFIG.mx<=0)return true;
  var cnt=0;
  for(var i=0;i<STATE.rec.length;i++){
    if(STATE.rec[i].nm===name)cnt++;
  }
  return cnt<CONFIG.mx;
}

function renderQuestion(){
  var q=STATE.eq[STATE.ci];if(!q)return;
  var total=STATE.eq.length,idx=STATE.ci,pct=((idx+1)/total*100).toFixed(1),sa=STATE.an[idx];
  var optsHtml='';
  for(var i=0;i<q.a.length;i++){var L=String.fromCharCode(65+i),cl=(sa===i)?' selected':'';optsHtml+='<div class="option'+cl+'" onclick="selectOption('+i+')"><span class="option-letter">'+L+'</span><span class="option-text">'+q.a[i]+'</span></div>';}
  var navBtns='';
  for(var b=0;b<total;b++){var bc='tab-btn',bs='';if(b===idx){bc+=' active';bs+='background:#1890ff;color:#fff;border-color:#1890ff;'}else if(STATE.an[b]!==undefined){bs+='background:#e6f7ff;border-color:#1890ff;color:#1890ff;'}navBtns+='<button onclick="goQuestion('+b+')" class="'+bc+'" style="width:32px;height:32px;padding:0;'+bs+'">'+(b+1)+'</button>';}
  var prevDisabled=(idx===0)?' disabled':'';

  $('app').innerHTML='<div class="container"><div class="card"><div class="exam-header"><h1>'+CONFIG.t+'</h1><div class="exam-info"><span>姓名：'+STATE.nm+'</span><span id="timerDisplay">00:00</span><span>'+(idx+1)+' / '+total+'</span></div></div><div class="progress-bar"><div class="progress" style="width:'+pct+'%"></div></div><div class="question-card"><span class="question-number">'+(idx+1)+'</span><span class="question-text">'+q.q+'</span></div><div class="options">'+optsHtml+'</div><div class="exam-actions"><button type="button" onclick="prevQuestion()" class="btn btn-secondary"'+prevDisabled+'>← 上一题</button>'+nextBtn+'</div></div><div style="text-align:center;margin-top:20px"><div style="display:flex;justify-content:center;gap:8px;flex-wrap:wrap">'+navBtns+'</div></div></div>';

window.selectOption=function(i){STATE.an[STATE.ci]=i;var ops=document.querySelectorAll('.option');for(var j=0;j<ops.length;j++)ops[j].className='option'+(j===i?' selected':'');};
window.prevQuestion=function(){if(STATE.ci>0){STATE.ci--;renderQuestion()}};
window.nextQuestion=function(){if(STATE.ci<STATE.eq.length-1){STATE.ci++;renderQuestion()}};

window.submitExam=function(){
  var ua=0;for(var i=0;i<STATE.eq.length;i++)if(STATE.an[i]===undefined)ua++;
  if(ua>0&&!confirm('还有'+ua+'道题未作答，确定提交吗？'))return;
  stopTimer();var correct=0,results=[];
  for(var j=0;j<STATE.eq.length;j++){var q=STATE.eq[j],u=STATE.an[j],ok=(u===q.n);if(ok)correct++;results.push({q:q.q,a:q.a,n:q.n,e:q.e,m:q.m,u:u,ok:ok});}
  var score=correct*CONFIG.p,passed=(score>=CONFIG.s),elapsed=Math.floor((new Date()-STATE.st)/1000);
  STATE.rec.unshift({nm:STATE.nm,sc:score,tt:CONFIG.n*CONFIG.p,correct:correct,tq:CONFIG.n,passed:passed,tm:Math.floor(elapsed/60)+'分'+(elapsed%60)+'秒',dt:new Date().toLocaleString('zh-CN')});
  if(STATE.rec.length>200)STATE.rec=STATE.rec.slice(0,200);saveData();showResult(score,correct,STATE.eq.length,passed,results);
};

function showResult(score,correct,total,passed,results){
  var acc=Math.round((correct/total)*100),wrong=total-correct;
  $('app').innerHTML='<div class="container"><div class="card result-card"><h1>'+CONFIG.t+'</h1><p style="color:#666">'+STATE.nm+' 的考试成绩</p><div class="score-big '+(passed?'pass':'fail')+'">'+score+' 分</div><div style="font-size:20px;margin-bottom:10px;color:'+(passed?'#52c41a':'#ff4d4f')+'">'+(passed?'🎉 恭喜及格！':'😢 未及格，继续加油！')+'</div><div class="score-detail"><div><div class="num">'+correct+'</div><div class="label">答对题数</div></div><div><div class="num">'+wrong+'</div><div class="label">答错题数</div></div><div><div class="num">'+acc+'%</div><div class="label">正确率</div></div></div><button type="button" onclick="showReview()" class="btn btn-primary" style="margin-top:15px">查看错题解析</button><br><button type="button" onclick="restartExam()" class="btn btn-secondary" style="margin-top:15px">重新考试</button><div style="margin-top:20px"><a href="?mode=admin" class="btn btn-secondary" style="font-size:14px">🔧 后台管理</a></div></div></div>';
  window.lastResults=results;
}

window.showReview=function(){
  var results=window.lastResults||[],wrong=[];
  for(var i=0;i<results.length;i++)if(!results[i].ok)wrong.push(results[i]);
  var html='';
  if(wrong.length===0)html='<p style="text-align:center;color:#52c41a;font-size:18px;padding:40px">🎉 太棒了，全部答对！</p>';
  else{for(var w=0;w<wrong.length;w++){var it=wrong[w],oh='';for(var o=0;o<it.a.length;o++){var L=String.fromCharCode(65+o),bg='#f5f5f5';if(o===it.n)bg='#f6ffed;border:1px solid #b7eb8f;';else if(o===it.u&&o!==it.n)bg='#fff2f0;border:1px solid #ffccc7;';oh+='<div style="padding:8px 12px;margin:4px 0;border-radius:6px;background:'+bg+'"><strong>'+L+'.</strong> '+it.a[o]+(o===it.n?' ✓ 正确答案':'')+(o===it.u&&o!==it.n?' ✗ 您的答案':'')+'</div>';}html+='<div class="question-card" style="margin-bottom:20px;border-left:4px solid #ff4d4f"><div style="margin-bottom:15px"><span class="badge">'+getModule(it.m)+'</span><span style="color:#ff4d4f;font-weight:bold;margin-left:10px">✗ 错误</span></div><h3 style="margin-bottom:12px">'+it.q+'</h3>'+oh+'<div style="background:#fffbe6;padding:12px;border-radius:8px;border:1px solid #ffe58f;margin-top:12px"><strong>解析：</strong>'+it.e+'</div></div>';}}
  $('app').innerHTML='<div class="container"><div class="card"><div class="admin-header"><h2>错题解析（共'+wrong.length+'题）</h2><button type="button" onclick="backToResult()" class="btn btn-secondary">← 返回成绩</button></div>'+html+'</div></div>';
};

window.backToResult=function(){var results=window.lastResults||[],correct=0;for(var i=0;i<results.length;i++)if(results[i].ok)correct++;showResult(correct*CONFIG.p,correct,results.length,(correct*CONFIG.p)>=CONFIG.s,results);};
window.restartExam=function(){STATE.nm='';STATE.an={};STATE.eq=[];STATE.ci=0;showStart();};

function startTimer(){stopTimer();STATE.timer=setInterval(updateTimer,1000);}
function stopTimer(){if(STATE.timer){clearInterval(STATE.timer);STATE.timer=null;}}

window.switchTab=function(t){STATE.tab=t;showAdmin();};

function renderQuestionsTab(){
  return'<div style="display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap"><input type="text" placeholder="搜索题目..." class="form-group" style="flex:1;min-width:200px;margin:0" oninput="filterQuestions(this.value)" id="searchQ"><select id="filterM" onchange="filterQuestions(($(\'searchQ\')||{}).value||\'\')" style="padding:12px;border:1px solid #e8e8e8;border-radius:8px"><option value="">全部模块</option><option value="1">APP下载与登录</option><option value="2">门店订货操作</option><option value="3">采购入库/退货</option><option value="4">配送入库/退配</option><option value="5">委托收货/退回</option><option value="6">库存报损/报溢</option><option value="7">库存查询与盘点</option><option value="8">调拨与领用</option></select><button type="button" onclick="addQuestion()" class="btn btn-primary">+ 添加</button><button type="button" onclick="importQuestions()" class="btn btn-secondary">📥 导入</button><button type="button" onclick="exportQuestions()" class="btn btn-secondary">📤 导出</button></div><p style="color:#666;margin-bottom:15px">共 '+STATE.qs.length+' 道题目</p><div id="qList">'+renderQuestionsTable(STATE.qs)+'</div>';

function renderQuestionsTable(qs){
  if(!qs||qs.length===0)return'<div class="empty">📝 暂无题目</div>';
  var h='<table class="table"><thead><tr><th style="width:60px">ID</th><th>题目</th><th style="width:120px">模块</th><th style="width:100px">操作</th></tr></thead><tbody>';

  return h+'</tbody></table>';

window.filterQuestions=function(s){
  var m=($('filterM')||{}).value||'',f=STATE.qs;
  if(s){var t=s.toLowerCase();f=f.filter(function(q){return q.q.toLowerCase().indexOf(t)!==-1||q.a.some(function(o){return o.toLowerCase().indexOf(t)!==-1;});});}
  if(m)f=f.filter(function(q){return q.m===parseInt(m);});
  var el=$('qList');if(el)el.innerHTML=renderQuestionsTable(f);
};

window.addQuestion=function(){$('modalTitle').textContent='添加题目';var f=document.querySelector('#qModal form');if(f)f.reset();$('editId').value='';openModal();};
window.editQuestion=function(id){var qi=null;for(var i=0;i<STATE.qs.length;i++){if(STATE.qs[i].id===id){qi=STATE.qs[i];break}}if(!qi)return;$('modalTitle').textContent='编辑题目';$('editId').value=id;$('editQ').value=qi.q;$('editM').value=qi.m;$('editA0').value=qi.a[0]||'';$('editA1').value=qi.a[1]||'';$('editA2').value=qi.a[2]||'';$('editAns').value=qi.n;$('editExp').value=qi.e||'';openModal();};
window.saveQuestion=function(){var id=($('editId')||{}).value||'',d={q:($('editQ')||{}).value.trim(),m:parseInt(($('editM')||{}).value),a:[($('editA0')||{}).value.trim(),($('editA1')||{}).value.trim(),($('editA2')||{}).value.trim()],n:parseInt(($('editAns')||{}).value),e:($('editExp')||{}).value.trim()};if(id){var idx=-1;for(var i=0;i<STATE.qs.length;i++){if(STATE.qs[i].id===parseInt(id)){idx=i;break}}if(idx!==-1){for(var k in d)if(d[k]!==undefined)STATE.qs[idx][k]=d[k];}}else{var mx=0;for(var j=0;j<STATE.qs.length;j++)if(STATE.qs[j].id>mx)mx=STATE.qs[j].id;STATE.qs.push({id:mx+1,m:d.m,q:d.q,a:d.a,n:d.n,e:d.e});}saveData();closeModal();showAdmin();toast('保存成功！','success');};
window.deleteQuestion=function(id){if(!confirm('确定删除这道题吗？'))return;var idx=-1;for(var i=0;i<STATE.qs.length;i++){if(STATE.qs[i].id===id){idx=i;break}}if(idx!==-1){STATE.qs.splice(idx,1);saveData();showAdmin();toast('已删除');}};
window.importQuestions=function(){var ip=document.createElement('input');ip.type='file';ip.accept='.txt';ip.onchange=function(ev){var f=ev.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(ev2){try{var txt=ev2.target.result,lines=txt.split(/\r?\n/),imp=[],cur={};for(var i=0;i<lines.length;i++){var line=lines[i].trim();if(!line||line.charAt(0)=='#')continue;var m=line.match(/^\[题目(\d+)\]$/);if(m){if(cur.q){imp.push(cur);}cur={id:parseInt(m[1])};}else if(line.startsWith('模块=')){cur.m=parseInt(line.split('=')[1]);}else if(line.startsWith('问题=')){cur.q=line.substring(3);}else if(line.startsWith('选项A=')){cur.a=[line.substring(4),'',''];}else if(line.startsWith('选项B=')){if(cur.a)cur.a[1]=line.substring(4);}else if(line.startsWith('选项C=')){if(cur.a)cur.a[2]=line.substring(4);}else if(line.startsWith('答案=')){var ans=line.split('=')[1].trim();cur.n=(ans==='A'?0:ans==='B'?1:2);}else if(line.startsWith('解析=')){cur.e=line.substring(3);}}if(cur.q){imp.push(cur);}if(imp.length>0){var ids=STATE.qs.map(function(x){return x.id}),mx=Math.max.apply(null,[0].concat(ids));for(var j=0;j<imp.length;j++){if(ids.indexOf(imp[j].id)===-1){imp[j].id=++mx;STATE.qs.push(imp[j]);}}saveData();showAdmin();toast('成功导入 '+imp.length+' 道题目！','success');}else{toast('未解析到题目','error');}}catch(err){toast('解析失败：'+err.message,'error');}};r.readAsText(f);};ip.click();};window.exportQuestions=function(){var txt='# 奥琦玮供应链随堂测试题库\n# 版本: 4.0\n# 生成日期: '+new Date().toISOString().split('T')[0]+'\n\n';for(var i=0;i<STATE.qs.length;i++){var q=STATE.qs[i];txt+='[题目'+q.id+']\n模块='+q.m+'\n问题='+q.q+'\n选项A='+(q.a[0]||'')+'\n选项B='+(q.a[1]||'')+'\n选项C='+(q.a[2]||'')+'\n答案='+(q.n===0?'A':q.n===1?'B':'C')+'\n解析='+(q.e||'')+'\n\n';}var b=new Blob([txt],{type:'text/plain;charset=utf-8'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='questions.txt';a.click();URL.revokeObjectURL(u);toast('已导出题目','success');};

window.renderRecordsTab=function(){var html='<div style="padding:20px"><h2>📊 考试记录</h2>';if(STATE.rec.length===0){html+='<p style="color:#666;text-align:center;margin-top:20px">暂无考试记录</p>';}else{html+='<table style="width:100%;border-collapse:collapse;margin-top:15px;font-size:14px"><thead><tr style="background:#f5f5f5"><th style="padding:10px;border:1px solid #ddd;text-align:left">姓名</th><th style="padding:10px;border:1px solid #ddd;text-align:center">分数</th><th style="padding:10px;border:1px solid #ddd;text-align:center">正确数</th><th style="padding:10px;border:1px solid #ddd;text-align:center">正确率</th><th style="padding:10px;border:1px solid #ddd;text-align:center">用时</th><th style="padding:10px;border:1px solid #ddd;text-align:center">日期</th><th style="padding:10px;border:1px solid #ddd;text-align:center">状态</th></tr></thead><tbody>';for(var i=0;i<STATE.rec.length;i++){var r=STATE.rec[i];var acc=r.tq>0?Math.round(r.correct/r.tq*100):0;html+='<tr><td style="padding:8px;border:1px solid #ddd">'+r.nm+'</td><td style="padding:8px;border:1px solid #ddd;text-align:center;font-weight:bold">'+r.sc+'</td><td style="padding:8px;border:1px solid #ddd;text-align:center">'+r.correct+'/'+r.tq+'</td><td style="padding:8px;border:1px solid #ddd;text-align:center">'+acc+'%</td><td style="padding:8px;border:1px solid #ddd;text-align:center">'+r.tm+'</td><td style="padding:8px;border:1px solid #ddd;text-align:center;font-size:12px">'+r.dt+'</td><td style="padding:8px;border:1px solid #ddd;text-align:center">'+(r.passed?'✅':'❌')+'</td></tr>';}html+='</tbody></table>';}html+='<div style="margin-top:20px"><button onclick="exportRecords()" class="btn btn-primary" style="margin-right:10px">导出记录</button><button onclick="clearRecords()" class="btn btn-danger">清空记录</button></div></div>';return html;};window.exportRecords=function(){var csv='姓名,分数,正确数,总分,用时,日期,是否及格\n';for(var i=0;i<STATE.rec.length;i++){var r=STATE.rec[i];csv+=r.nm+','+r.sc+','+r.correct+','+r.tq+','+r.tm+','+r.dt+','+(r.passed?'及格':'不及格')+'\n';}var b=new Blob([csv],{type:'text/csv;charset=utf-8'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='exam_records.csv';a.click();URL.revokeObjectURL(u);toast('已导出','success');};window.clearRecords=function(){if(!confirm('确定清空所有考试记录吗？此操作不可恢复！'))return;STATE.rec=[];saveData();showAdmin();toast('已清空');};
