.toolbar .search{flex:1;min-width:200px}
.empty{text-align:center;padding:60px 20px;color:#666}

const Q=[{id:1,module:1,question:"易企APP在哪里可以下载？",options:["手机应用商店","电脑官网","微信小程序"],answer:0,explanation:"易企APP可在手机应用商店搜索下载，支持iOS和Android系统。"},{id:2,module:1,question:"首次登录易企APP需要什么信息？",options:["手机号和验证码","账号和密码","身份证号码"],answer:1,explanation:"首次登录需要输入分配给您的账号和密码。"},{id:3,module:1,question:"忘记密码后应该联系谁？",options:["自行重置","联系管理员","无法找回"],answer:1,explanation:"密码重置需要联系系统管理员处理。"},{id:4,module:1,question:"易企APP支持哪些手机系统？",options:["仅iOS","仅Android","iOS和Android都支持"],answer:2,explanation:"易企APP支持iOS和Android双系统。"},{id:5,module:1,question:"登录后无法看到门店数据，可能是什么原因？",options:["网络问题","账号未绑定门店","手机内存不足"],answer:1,explanation:"账号需要先绑定对应门店才能看到门店数据。"},{id:6,module:2,question:"门店订货在易企APP哪个模块？",options:["配送申请","订货申请","采购订单"],answer:0,explanation:"门店订货功能在【配送申请】模块中。"},{id:7,module:2,question:"新建订货单时，门店名称是否可以修改？",options:["可以随意修改","只能选择自己绑定的门店","由系统自动匹配"],answer:1,explanation:"门店订货只能选择自己绑定的门店，无法随意修改。"},{id:8,module:2,question:"订货单提交后需要谁审核？",options:["自动通过","店长审核","总部审核"],answer:1,explanation:"门店订货单需要店长审核后才能继续流转。"},{id:9,module:2,question:"订货单审核通过后会怎样？",options:["直接发货","自动分单给供应商","需要再次确认"],answer:1,explanation:"审核通过后系统会自动分单给对应供应商。"},{id:10,module:2,question:"可以在订货单中添加备注吗？",options:["不可以","可以填写特殊要求","只能由管理员添加"],answer:1,explanation:"订货时可以填写备注说明特殊要求。"},{id:11,module:2,question:"订货单的状态不包括以下哪个？",options:["待审核","已发货","已归档"],answer:2,explanation:"订货单状态包括待审核、审核中、已通过、已发货等，不包括已归档。"},{id:12,module:2,question:"一个订货单可以包含多少个货品？",options:["只能1个","只能10个以内","数量不限"],answer:2,explanation:"一个订货单可以包含任意数量的货品。"},{id:13,module:3,question:"采购入库单由谁创建？",options:["门店","供应商","总部采购"],answer:1,explanation:"采购入库单由供应商在系统中创建。"},{id:14,module:3,question:"收到货品时发现数量不符应该怎么办？",options:["直接签收","在系统中填写实际收货数量","拒收全部货物"],answer:1,explanation:"收货数量不符时，在系统中填写实际收货数量，系统会自动生成退配单。"},{id:15,module:3,question:"采购退货需要什么条件？",options:["随时可退","需要先有入库记录","需要领导审批"],answer:1,explanation:"采购退货需要先有对应的入库记录才能操作。"},{id:16,module:3,question:"入库单的"入库差异"指什么？",options:["价格差异","实际入库数量与单据数量的差异","仓库面积差异"],answer:1,explanation:"入库差异指实际到货数量与单据上数量的差异。"},{id:17,module:3,question:"入库验收时发现货品质量问题应该？",options:["正常入库","拒绝入库并备注","自行处理"],answer:1,explanation:"质量问题的货品应拒绝入库并在系统中备注说明。"},{id:18,module:3,question:"供应商可以在手机上操作什么？",options:["仅查看订单","接单、配送、查库存","所有功能"],answer:1,explanation:"供应商可在手机端接单、查看配送信息、查询库存等核心功能。"},{id:19,module:4,question:"配送入库应该在哪里操作？",options:["门店APP","供应商后台","总部系统"],answer:0,explanation:"配送入库由门店在易企APP中操作确认收货。"},{id:20,module:4,question:"配送入库时发现包装破损应该？",options:["正常入库","拍照留证后入库","拒收并投诉"],answer:1,explanation:"发现包装破损应拍照留证，然后在系统中备注后入库。"},{id:21,module:4,question:"入库数量少于配送数量时，系统会？",options:["自动补货","自动生成退配单","自动罚款"],answer:1,explanation:"入库差异会自动生成退配单给供应商。"},{id:22,module:4,question:"退配单由谁处理？",options:["门店","供应商","物流公司"],answer:1,explanation:"退配单由供应商接收并处理退货。"},{id:23,module:4,question:"配送单状态的"已签收"表示什么？",options:["门店已收货","供应商已发货","物流已揽件"],answer:0,explanation:"已签收状态表示门店已确认收货入库。"},{id:24,module:4,question:"入库时间可以在手机上修改吗？",options:["可以随意修改","不可以修改","需要申请审批"],answer:2,explanation:"入库时间为系统自动记录，如需修改需要走审批流程。"},{id:25,module:5,question:"委托收货是什么意思？",options:["委托物流公司收货","委托其他门店代收货物","委托供应商发货"],answer:1,explanation:"委托收货是指委托其他门店代为签收和保管货物。"},{id:26,module:5,question:"委托收货需要设置什么？",options:["无需设置","设置委托关系","双方协议"],answer:1,explanation:"需要在系统中设置门店间的委托收货关系。"},{id:27,module:5,question:"委托收货后货物归属谁？",options:["委托方门店","被委托方门店","总部统一管理"],answer:0,explanation:"货物归属委托方门店，被委托方只是代收。"},{id:28,module:5,question:"委托收货的退货由谁操作？",options:["被委托方","委托方","供应商"],answer:1,explanation:"委托收货的退货由委托方门店发起操作。"},{id:29,module:5,question:"委托收货关系需要在哪里设置？",options:["易企APP","PC后台系统","微信小程序"],answer:1,explanation:"委托收货关系需要在PC后台系统中配置。"},{id:30,module:6,question:"库存报损是什么操作？",options:["报备损失","减少库存数量","记录损耗"],answer:1,explanation:"库存报损是将实际减少的库存数量在系统中做记录。"},{id:31,module:6,question:"以下哪种情况需要报损？",options:["正常销售","货品过期/损坏/丢失","正常盘点"],answer:1,explanation:"货品过期、损坏、丢失等非正常减少需要报损。"},{id:32,module:6,question:"库存报溢是什么操作？",options:["减少库存","增加库存数量","转移库存"],answer:1,explanation:"库存报溢是将实际多出的库存数量在系统中增加记录。"},{id:33,module:6,question:"报损报溢需要提供什么？",options:["无需凭证","图片或说明","领导签字"],answer:1,explanation:"报损报溢操作需要上传图片或填写说明作为凭证。"},{id:34,module:6,question:"报损报溢单需要审核吗？",options:["自动通过","需要审核","看金额大小"],answer:1,explanation:"报损报溢单需要相关人员审核后才能生效。"},{id:35,module:6,question:"报溢的库存可以随便增加吗？",options:["可以随意填","必须有实际依据","系统自动计算"],answer:1,explanation:"报溢必须有实际盘点数据作为依据，不能随意填写。"},{id:36,module:7,question:"库存查询在APP哪里？",options:["首页","我的","库存模块"],answer:2,explanation:"库存查询功能在易企APP的库存模块中。"},{id:37,module:7,question:"可以查询哪些库存？",options:["只能查自己门店","绑定门店的库存","所有门店"],answer:1,explanation:"可以查询自己绑定门店的库存数据。"},{id:38,module:7,question:"新建盘点单的前提是什么？",options:["随时可建","仓库必须有库存","必须报损后才能"],answer:1,explanation:"仓库必须有期初数据或出入库记录后才能新建盘点单。"},{id:39,module:7,question:"盘点时发现数量少了怎么办？",options:["不记录","做报损","做报溢"],answer:1,explanation:"盘点发现数量少了需要做报损处理。"},{id:40,module:7,question:"盘点单完成后库存会怎样？",options:["不变","更新为盘点数量","清零"],answer:1,explanation:"盘点单审核通过后会更新库存为实际盘点数量。"},{id:41,module:7,question:"可以按什么条件筛选库存？",options:["只能按门店","按仓库/类别/供应商等","无法筛选"],answer:1,explanation:"库存支持按仓库、货品类别、供应商等多种条件筛选。"},{id:42,module:7,question:"库存查询可以看到什么信息？",options:["只有数量","数量、金额、批次等","只有金额"],answer:1,explanation:"库存查询可看到数量、金额、批次、保质期等多维度信息。"},{id:43,module:8,question:"调拨单和领用单的区别是？",options:["没有区别","调拨是库存转移，领用是消耗","调拨需要审批，领用不需要"],answer:1,explanation:"调拨是门店间库存转移，领用是库存消耗出库。"},{id:44,module:8,question:"店间调拨需要几个门店操作？",options:["1个门店","2个门店","3个门店"],answer:1,explanation:"店间调拨需要调出门店和调入门店双方都操作确认。"},{id:45,module:8,question:"领用单完成后会怎样？",options:["库存转移","库存减少","库存不变"],answer:1,explanation:"领用单是库存消耗出库，操作完成后库存会减少。"},{id:46,module:8,question:"调拨单由谁发起？",options:["调出门店","调入门店","总部"],answer:0,explanation:"调拨单由调出门店在APP中发起申请。"},{id:47,module:8,question:"调拨申请需要审核吗？",options:["不需要","需要调入门店确认","需要总部审核"],answer:1,explanation:"调拨申请需要调入门店确认后才能生效。"},{id:48,module:8,question:"领用单适用于什么场景？",options:["门店间转移","内部领用消耗","退货给供应商"],answer:1,explanation:"领用单适用于门店内部领用消耗的操作。"},{id:49,module:8,question:"调拨和领用可以在APP上操作吗？",options:["只能PC端","可以在APP操作","必须现场操作"],answer:1,explanation:"调拨和领用都支持在易企APP中操作。"},{id:50,module:8,question:"调拨单的库存会立即变化吗？",options:["立即变化","需对方确认后才变化","次日生效"],answer:1,explanation:"调拨单需要对方门店确认后库存才会变化。"},{id:51,module:1,question:"APP登录后的首页可以自定义吗？",options:["不可以","可以添加常用功能","只能系统设置"],answer:1,explanation:"APP首页可以自定义添加常用功能快捷入口。"},{id:52,module:2,question:"订货单提交后发现填错了可以修改吗？",options:["随时可改","审核前可以修改","不能修改只能撤销"],answer:1,explanation:"订货单在审核前可以修改，审核通过后不能修改。"},{id:53,module:3,question:"入库单可以打印吗？",options:["不可以","可以打印","只能电子版"],answer:1,explanation:"入库单支持打印，可用于纸质存档。"},{id:54,module:4,question:"入库时可以选择部分签收吗？",options:["不可以","可以按实际数量签收","必须全部签收"],answer:1,explanation:"可以按照实际到货数量签收，差异会自动生成退配单。"},{id:55,module:5,question:"委托收货的货物存放在哪里？",options:["委托方门店","被委托方门店仓库","总部仓库"],answer:1,explanation:"委托收货的货物存放在被委托方门店的仓库中。"},{id:56,module:6,question:"报损单审核不通过会怎样？",options:["库存自动修正","库存保持不变","需要重新提交"],answer:1,explanation:"报损单审核不通过时，库存数据保持不变。"},{id:57,module:7,question:"盘点可以只盘部分货品吗？",options:["不可以","可以按类别选择","必须全盘"],answer:1,explanation:"盘点支持按货品类别筛选，可以只盘部分货品。"},{id:58,module:8,question:"调拨出去的货物还能用于其他操作吗？",options:["可以","在对方确认前不能","永久不能"],answer:1,explanation:"调拨出去的货物在对方确认前，调出门店仍可使用。"},{id:59,module:2,question:"订货模板的作用是什么？",options:["没有作用","快速添加常用货品","限制订货种类"],answer:1,explanation:"订货模板可以快速添加常用货品，提高订货效率。"},{id:60,module:7,question:"盘点差异是指导入的库存和实际库存的差值吗？",options:["不是","是的","是预期差异"],answer:1,explanation:"盘点差异指系统导入的库存数量与实际盘点数量的差值。"}];

    records=JSON.parse(localStorage.getItem('scmExamR')||'[]');
  }catch(e){}
}

function startE(e){e.preventDefault();examinee=document.getElementById('n').value.trim();if(!examinee){t('请输入姓名','error');return}examQuestions=shuffle([...questions]).slice(0,total);answers={};currentQ=0;startTime=new Date();showQ()}

function showQ(){
  const q=examQuestions[currentQ],p=((currentQ+1)/examQuestions.length)*100;
  document.getElementById('app').innerHTML=`
    <div class="container">
      <div class="card">
        <div class="exam-header"><h1>${title}</h1>
          <div class="exam-info">

          <span class="question-number">${currentQ+1}</span>
          <span class="question-text">${q.question}</span>
        </div>
        <div class="options">
          ${q.options.map((o,i)=>`<div class="option ${answers[currentQ]===i?'selected':''}" onclick="sel(${i})"><span class="option-letter">${String.fromCharCode(65+i)}</span><span class="option-text">${o}</span></div>`).join('')}

          <button class="btn btn-secondary" onclick="prev()" ${currentQ===0?'disabled':''}>← 上一题</button>

            `<button class="btn btn-primary" onclick="submit()">提交试卷</button>`:
            `<button class="btn btn-primary" onclick="next()">下一题 →</button>`}

        </div>
      </div>
    </div>`;
  if(!window.timer)window.timer=setInterval(updTimer,1000);
}

function updTimer(){
  if(!startTime)return;
  const e=Math.floor((new Date()-startTime)/1000);
  const el=document.getElementById('t');
  if(el)el.textContent=`${Math.floor(e/60).toString().padStart(2,'0')}:${(e%60).toString().padStart(2,'0')}`;
}

function sel(i){answers[currentQ]=i;document.querySelectorAll('.option').forEach((o,j)=>{o.classList.toggle('selected',j===i)});updNav()}
function updNav(){document.querySelectorAll('.tab-btn').forEach((b,i)=>{b.style.background=i===currentQ?'#1890ff':'';b.style.color=i===currentQ?'#fff':'';b.style.borderColor=answers[i]!==undefined?'#1890ff':'';if(i!==currentQ&&answers[i]!==undefined){b.style.background='#e6f7ff';b.style.color='#1890ff'}})}

function prev(){if(currentQ>0){currentQ--;showQ()}}
function next(){if(currentQ<examQuestions.length-1){currentQ++;showQ()}}
function go(i){currentQ=i;showQ()}

function submit(){
  const u=examQuestions.filter((_,i)=>answers[i]===undefined).length;
  if(u>0&&!confirm(`还有${u}道题未作答，确定提交吗？`))return;
  if(window.timer){clearInterval(window.timer);window.timer=null}
  let correct=0;
  const results=examQuestions.map((q,i)=>{const ua=answers[i],ic=ua===q.answer;if(ic)correct++;return{...q,userAnswer:ua,isCorrect:ic}});
  const score=correct*perQ,passed=score>=passScore;
  const e=Math.floor((new Date()-startTime)/1000);
  records.unshift({name:examinee,score,total:total*perQ,correct,totalQ:total,passed,time:`${Math.floor(e/60)}分${e%60}秒`,date:new Date().toLocaleString('zh-CN')});
  records=records.slice(0,100);saveData();

}

          <div><div class="num">${acc}%</div><div class="label">正确率</div></div>

        <div style="margin-top:20px;"><a href="?mode=admin" class="btn btn-secondary" style="font-size:14px;">🔧 后台管理</a></div>
      </div>
    </div>`;
}

function showR(results){

      <div class="card">

          <h2>错题解析（共${wrong.length}题）</h2>
          <button class="btn btn-secondary" onclick="showResult(${results.filter(r=>r.isCorrect).length*perQ},${results.filter(r=>r.isCorrect).length},${results.length},${results.filter(r=>r.isCorrect).length*perQ>=passScore},${JSON.stringify(results).replace(/"/g,'&quot;')})">返回成绩</button>
        </div>
        ${wrong.length===0?'<p style="text-align:center;color:#52c41a;">🎉 太棒了，全部答对！</p>':wrong.map(q=>`
          <div class="question-card" style="margin-bottom:20px;border-left:4px solid #ff4d4f;">

            <div style="background:#fffbe6;padding:12px;border-radius:8px;border:1px solid #ffe58f;"><strong>解析：</strong>${q.explanation}</div>
          </div>`).join('')}
      </div>
    </div>`;

function renderQT(){
  return`
    <div class="toolbar">
      <div class="search"><input type="text" placeholder="搜索题目..." oninput="fQ(this.value)"></div>
      <select id="fM" onchange="fQ(document.querySelector('.toolbar input').value)">
        <option value="">全部模块</option><option value="1">APP下载与登录</option><option value="2">门店订货操作</option><option value="3">采购入库/退货</option>

      </select>

function renderQTbl(qs){
  if(qs.length===0)return'<div class="empty"><div class="empty-icon">📝</div>暂无题目</div>';
  return`<table class="table"><thead><tr><th style="width:60px;">ID</th><th>题目</th><th style="width:120px;">模块</th><th style="width:100px;">操作</th></tr></thead><tbody>${qs.map(q=>`<tr><td>${q.id}</td><td style="max-width:400px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${q.question}</td><td><span class="badge badge-module">${getM(q.module)}</span></td><td class="actions"><button class="btn btn-secondary" style="padding:4px 8px;font-size:12px;" onclick="editQ(${q.id})">编辑</button><button class="btn btn-danger" style="padding:4px 8px;font-size:12px;" onclick="delQ(${q.id})">删除</button></td></tr>`).join('')}</tbody></table>`;
}

function fQ(s){
  const m=document.getElementById('fM')?.value||'';
  let f=questions;
  if(s){const txt=s.toLowerCase();f=f.filter(q=>q.question.toLowerCase().includes(txt)||q.options.some(o=>o.toLowerCase().includes(txt)))}
  if(m)f=f.filter(q=>q.module===parseInt(m));
  document.getElementById('qL').innerHTML=renderQTbl(f);
}

function addQ(){document.getElementById('mT').textContent='添加题目';document.getElementById('qf').reset();document.getElementById('qId').value='';openM()}
function editQ(id){const q=questions.find(q=>q.id===id);if(!q)return;document.getElementById('mT').textContent='编辑题目';document.getElementById('qId').value=q.id;document.getElementById('qq').value=q.question;document.getElementById('qm').value=q.module;document.getElementById('q0').value=q.options[0]||'';document.getElementById('q1').value=q.options[1]||'';document.getElementById('q2').value=q.options[2]||'';document.getElementById('qa').value=q.answer;document.getElementById('qe').value=q.explanation||'';openM()}

function saveQ(e){e.preventDefault();const id=document.getElementById('qId').value;const d={question:document.getElementById('qq').value.trim(),module:parseInt(document.getElementById('qm').value),options:[document.getElementById('q0').value.trim(),document.getElementById('q1').value.trim(),document.getElementById('q2').value.trim()],answer:parseInt(document.getElementById('qa').value),explanation:document.getElementById('qe').value.trim()};if(id){const i=questions.findIndex(q=>q.id===parseInt(id));if(i!==-1)questions[i]={...questions[i],...d}}else{const maxId=Math.max(0,...questions.map(q=>q.id));questions.push({id:maxId+1,type:'single',...d})}saveData();closeM();document.getElementById('tab-questions').innerHTML=renderQT();t('保存成功！','success')}

function delQ(id){if(!confirm('确定删除这道题目吗？'))return;const i=questions.findIndex(q=>q.id===id);if(i!==-1){questions.splice(i,1);saveData();document.getElementById('tab-questions').innerHTML=renderQT();t('已删除')}}

function importQ(){const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{try{const d=JSON.parse(ev.target.result);const imp=d.questions||d;if(Array.isArray(imp)){const ids=questions.map(q=>q.id);let max=Math.max(0,...ids);imp.forEach(q=>{if(!ids.includes(q.id)){q.id=++max;questions.push(q)}});saveData();document.getElementById('tab-questions').innerHTML=renderQT();t(`导入${imp.length}道题目成功！`,'success')}else{t('文件格式不正确','error')}}catch(err){t('解析失败','error')}};r.readAsText(f)};i.click()}

function exportQ(){const d={version:"1.0",lastUpdated:new Date().toISOString().split('T')[0],questions,settings:{title,total,passScore,perQ}};const b=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download='questions.json';a.click();URL.revokeObjectURL(u);t('已导出','success')}

function renderRT(){

  return`<div class="toolbar"><button class="btn btn-secondary" onclick="exportR()">📤 导出记录</button><button class="btn btn-danger" onclick="clearR()">🗑️ 清空记录</button></div><p style="color:#666;margin-bottom:15px;">共${records.length}条记录</p><table class="table"><thead><tr><th>姓名</th><th>分数</th><th>正确数</th><th>用时</th><th>考试时间</th><th>状态</th></tr></thead><tbody>${records.map(r=>`<tr><td>${r.name}</td><td><strong>${r.score}</strong> / ${r.total}</td><td>${r.correct} / ${r.totalQ}</td><td>${r.time}</td><td>${r.date}</td><td><span class="badge" style="background:${r.passed?'#f6ffed;color:#52c41a;':'#fff2f0;color:#ff4d4f;'};padding:4px 8px;">${r.passed?'✓ 及格':'✗ 不及格'}</span></td></tr>`).join('')}</tbody></table>`;
}

function exportR(){const csv=[['姓名','分数','总分','答对','总题数','用时','考试时间','状态'].join(','),...records.map(r=>[r.name,r.score,r.total,r.correct,r.totalQ,r.time,r.date,r.passed?'及格':'不及格'].join(','))].join('\n');const b=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=`考试记录_${new Date().toLocaleDateString('zh-CN').replace(/\//g,'-')}.csv`;a.click();URL.revokeObjectURL(u);t('已导出','success')}
function clearR(){if(!confirm('确定清空所有记录吗？'))return;records=[];saveData();document.getElementById('tab-records').innerHTML=renderRT();t('已清空')}

function renderST(){
  const tr=records.length,pc=records.filter(r=>r.passed).length,pr=tr>0?Math.round((pc/tr)*100):0,avg=tr>0?Math.round(records.reduce((s,r)=>s+r.score,0)/tr):0;
  const ms={};for(let i=1;i<=8;i++)ms[i]=questions.filter(q=>q.module===i).length;
  return`<div class="stats-grid"><div class="stat-card"><div class="num">${tr}</div><div class="label">考试人次</div></div><div class="stat-card green"><div class="num">${pr}%</div><div class="label">及格率</div></div><div class="stat-card orange"><div class="num">${avg}</div><div class="label">平均分</div></div><div class="stat-card"><div class="num">${questions.length}</div><div class="label">题库总量</div></div></div><h3 style="margin:30px 0 15px;">各模块题目分布</h3><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:15px;">${Object.entries(ms).map(([id,c])=>`<div style="background:#f5f5f5;padding:15px;border-radius:8px;display:flex;justify-content:space-between;align-items:center;"><span>${getM(parseInt(id))}</span><span style="background:#1890ff;color:#fff;padding:4px 12px;border-radius:12px;font-weight:bold;">${c}题</span></div>`).join('')}</div>${tr>0?`<h3 style="margin:30px 0 15px;">最近考试趋势</h3><div style="background:#fafafa;padding:20px;border-radius:8px;"><p style="color:#666;">最近10次考试分数：</p><div style="display:flex;gap:8px;margin-top:15px;align-items:flex-end;height:100px;">${records.slice(0,10).reverse().map(r=>{const h=(r.score/100)*80+20;const c=r.passed?'#52c41a':'#ff4d4f';return`<div style="flex:1;background:${c};height:${h}px;border-radius:4px 4px 0 0;display:flex;align-items:flex-end;justify-content:center;padding-bottom:5px;font-size:12px;color:#fff;font-weight:bold;" title="${r.name}:${r.score}分">${r.score}</div>`}).join('')}</div></div>`:''}`;
}

function showSet(){
  document.getElementById('app').innerHTML=`
    <div class="container"><div class="card" style="max-width:600px;margin:50px auto;">
      <div class="admin-header"><h2>⚙️ 考试设置</h2><button class="btn btn-secondary" onclick="showA()">返回</button></div>
      <form onsubmit="saveSet(event)">
        <div class="form-group"><label>考试标题</label><input type="text" id="sT" value="${title}"></div>
        <div class="form-group"><label>题目数量</label><input type="number" id="sN" value="${total}" min="1" max="100"></div>
        <div class="form-group"><label>每题分值</label><input type="number" id="sS" value="${perQ}" min="1"></div>
        <div class="form-group"><label>及格分数</label><input type="number" id="sP" value="${passScore}" min="1"></div>
        <button type="submit" class="btn btn-primary">保存设置</button>
      </form>
      <div style="margin-top:30px;padding-top:30px;border-top:1px solid #e8e8e8;">
        <h3 style="margin-bottom:15px;">🔐 修改密码</h3>
        <form onsubmit="chgPwd(event)">
          <div class="form-group"><label>当前密码</label><input type="password" id="op" required></div>
          <div class="form-group"><label>新密码</label><input type="password" id="np" required></div>
          <div class="form-group"><label>确认新密码</label><input type="password" id="cp" required></div>
          <button type="submit" class="btn btn-danger">修改密码</button>
        </form>
      </div>
    </div></div>`;
}

function saveSet(e){e.preventDefault();title=document.getElementById('sT').value;total=parseInt(document.getElementById('sN').value);perQ=parseInt(document.getElementById('sS').value);passScore=parseInt(document.getElementById('sP').value);saveData();t('设置已保存','success')}
function chgPwd(e){e.preventDefault();const op=document.getElementById('op').value,np=document.getElementById('np').value,cp=document.getElementById('cp').value;if(op!==adminPwd){t('当前密码错误','error');return}if(np!==cp){t('两次密码不一致','error');return}if(np.length<6){t('新密码至少6位','error');return}adminPwd=np;t('密码已修改','success');document.getElementById('op').value='';document.getElementById('np').value='';document.getElementById('cp').value=''}

function openM(){document.getElementById('qModal').classList.add('show')}
function closeM(){document.getElementById('qModal').classList.remove('show')}

function getM(m){const ms={1:'APP下载与登录',2:'门店订货操作',3:'采购入库/退货',4:'配送入库/退配',5:'委托收货/退回',6:'库存报损/报溢',7:'库存查询与盘点',8:'调拨与领用'};return ms[m]||'未知模块'}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function t(m,s=''){const e=document.querySelector('.toast');if(e)e.remove();const toast=document.createElement('div');toast.className=`toast ${s}`;toast.textContent=m;document.body.appendChild(toast);setTimeout(()=>toast.classList.add('show'),10);setTimeout(()=>{toast.classList.remove('show');setTimeout(()=>toast.remove(),300)},3000)}
</script>
</body>
</html>
