  var tl=S.eq.length,idx=S.ci,pct=((idx+1)/tl*100).toFixed(1),sa=S.an[idx];
  var oh='';
  for(var i=0;i<q.a.length;i++){
    var L=String.fromCharCode(65+i),cl=(sa===i)?' sel':'';
    oh+='<div class="op'+cl+'" data-i="'+i+'" onclick="selO('+i+')"><span class="ol">'+L+'</span><span class="ot">'+q.a[i]+'</span></div>';
  }
  var nh='';
  for(var b=0;b<tl;b++){var bc='tb';var bs='';
    if(b===idx){bc+=' on';bs+='background:#1890ff;color:#fff;border-color:#1890ff;'}
    else if(S.an[b]!==undefined){bs+='background:#e6f7ff;border-color:#1890ff;color:#1890ff;'}
    nh+='<button onclick="goQ('+b+')" class="'+bc+'" style="width:32px;height:32px;padding:0;'+bs+'">'+(b+1)+'</button>';}
  var pd=(idx===0)?' disabled':'';
  var nb=(idx===tl-1)?'<button type="button" onclick="subE()" class="btn btn-p">提交试卷</button>':'<button type="button" onclick="nxQ()" class="btn btn-p">下一题 →</button>';
  E('app').innerHTML=
    '<style>'+CSS+'</style>'+
    '<div class="container"><div class="card">'+
      '<div class="eh"><h1>'+C.t+'</h1><div class="ei"><span>姓名：'+S.nm+'</span><span id="tm">00:00</span><span>'+(idx+1)+' / '+tl+'</span></div></div>'+
      '<div class="pb"><div class="pg" style="width:'+pct+'%"></div></div>'+
      '<div class="qc"><span class="qn">'+(idx+1)+'</span><span class="qt">'+q.q+'</span></div>'+
      '<div class="ops">'+oh+'</div>'+
      '<div class="ea"><button type="button" onclick="pvQ()" class="btn btn-sec"'+pd+'>← 上一题</button>'+nb+'</div>'+
    '</div>'+
    '<div style="text-align:center;margin-top:20px"><div style="display:flex;justify-content:center;gap:8px;flex-wrap:wrap">'+nh+'</div></div>'+
    '</div>';
}
window.selO=function(i){S.an[S.ci]=i;var ops=document.querySelectorAll('.op');
  for(var j=0;j<ops.length;j++)ops[j].className='op'+(j===i?' sel':'')};
window.pvQ=function(){if(S.ci>0){S.ci--;rQ()}};
window.nxQ=function(){if(S.ci<S.eq.length-1){S.ci++;rQ()}};

/* 提交 */
window.subE=function(){
  var ua=0;for(var i=0;i<S.eq.length;i++)if(S.an[i]===undefined)ua++;
  if(ua>0&&!confirm('还有'+ua+'道题未作答，确定提交吗？'))return;
  ct();var cr=0,res=[];
  for(var j=0;j<S.eq.length;j++){var q=S.eq[j],u=S.an[j],ok=(u===q.n);if(ok)cr++;
    res.push({q:q.q,a:q.a,n:q.n,e:e,module:q.m,ua:u,ok:ok});}
  var sc=cr*C.p,ps=(sc>=C.s),el=Math.floor((new Date()-S.st)/1000);
  S.rec.unshift({nm:S.nm,sc:sc,tt:C.n*C.p,cr:cr,tq:C.n,ps:ps,
    tm:Math.floor(el/60)+'分'+(el%60)+'秒',dt:new Date().toLocaleString('zh-CN')});
  if(S.rec.length>200)S.rec=S.rec.slice(0,200);sv();
  rR(sc,cr,S.eq.length,ps,res);
};

window.shRev=function(){
  var res=window._lr||[],wg=[];
  for(var i=0;i<res.length;i++)if(!res[i].ok)wg.push(res[i]);
  var html='';
  if(wg.length===0)html='<p style="text-align:center;color:#52c41a;font-size:18px;padding:40px">🎉 全部答对！</p>';
  else{
    for(var w=0;w<wg.length;w++){
      var it=wg[w],oh='';
      for(var o=0;o<it.a.length;o++){var L=String.fromCharCode(65+o),bg='#f5f5f5';
        if(o===it.n)bg='#f6ffed;border:1px solid #b7eb8f';
        else if(o===it.ua&&o!==it.n)bg='#fff2f0;border:1px solid #ffccc7';
        oh+='<div style="padding:8px 12px;margin:4px 0;border-radius:6px;background:'+bg+'"><strong>'+L+'.</strong> '+it.a[o]+
          (o===it.n?' ✓ 正确':'')+(o===it.ua&&o!==it.n?' ✗ 您的答':'')+'</div>';}
      html+='<div class="qc" style="margin-bottom:20px;border-left:4px solid #ff4d4f">'+
        '<div style="margin-bottom:15px"><span class="bdg bdg-m">'+mn(it.module)+'</span><span style="color:#ff4d4f;font-weight:bold;margin-left:10px">✗ 错误</span></div>'+
        '<h3 style="margin-bottom:12px">'+it.q+'</div>'+oh+
        '<div style="background:#fffbe6;padding:12px;border-radius:8px;border:1px solid #ffe58f;margin-top:12px"><strong>解析：</strong>'+it.e+'</div></div>';
    }

};
window.bkRes=function(){var res=window._lr||[];var cr=0;for(var i=0;i<res.length;i++)if(res[i].ok)cr++;rR(cr*C.p,cr,res.length,(cr*C.p)>=C.s,res)};

    '<select id="fmSel" onchange="fQ((E(\'sqIn\')||{}).value||\'\')"><option value="">全部模块</option><option value="1">APP下载与登录</option><option value="2">门店订货操作</option><option value="3">采购入库/退货</option><option value="4">配送入库/退配</option><option value="5">委托收货/退回</option><option value="6">库存报损/报溢</option><option value="7">库存查询与盘点</option><option value="8">调拨与领用</option></select>'+

    '<p style="color:#666;margin-bottom:15px">共 '+S.qs.length+' 道题目</p><div id="qL">'+rQTbl(S.qs)+'</div>';

function rQTbl(qs){
  if(!qs||qs.length===0)return'<div class="mt">📝 暂无题目</div>';
  var h='<table class="tbl"><thead><tr><th style="width:60px">ID</th><th>题目</th><th style="width:120px">模块</th><th style="width:100px">操作</th></tr></thead><tbody>';
  for(var i=0;i<qs.length;i++){
    var qi=qs[i];
    h+='<tr><td>'+qi.id+'</td><td style="max-width:400px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+qi.q+'</td><td><span class="bdg bdg-m">'+mn(qi.m)+'</span></td><td><button type="button" onclick="edQ('+qi.id+')" class="btn btn-sec" style="padding:4px 8px;font-size:12px">编辑</button><button type="button" onclick="dlQ('+qi.id+')" class="btn btn-d" style="padding:4px 8px;font-size:12px">删除</button></td></tr>';
  }
  return h+'</tbody></table>';
}
window.fQ=function(s){
  var m=(E('fmSel')||{}).value||'',f=S.qs;
  if(s){var t=s.toLowerCase();f=f.filter(function(q){return q.q.toLowerCase().indexOf(t)!==-1||q.a.some(function(o){return o.toLowerCase().indexOf(t)!==-1)})}}
  if(m)f=f.filter(function(q){return q.m===parseInt(m)});
  var el=E('qL');if(el)el.innerHTML=rQTbl(f);
};
window.addQ=function(){E('mt').textContent='添加题目';var f=document.querySelector('#qMd form');if(f)f.reset();E('eid').value='';opM()};
window.edQ=function(id){
  var qi=null;for(var i=0;i<S.qs.length;i++){if(S.qs[i].id===id){qi=S.qs[i];break}}if(!qi)return;
  E('mt').textContent='编辑题目';E('eid').value=id;E('eq').value=qi.q;E('em').value=qi.m;E('ea0').value=qi.a[0]||'';E('ea1').value=qi.a[1]||'';E('ea2').value=qi.a[2]||'';E('ean').value=qi.n;E('ee').value=qi.e||'';opM()
};
window.svQ=function(){
  var id=(E('eid')||{}).value||'',d={q:(E('eq')||{}).value.trim(),m:parseInt((E('em')||{}).value),a:[(E('ea0')||{}).value.trim(),(E('ea1')||{}).value.trim(),(E('ea2')||{}).value.trim()],n:parseInt((E('ean')||{}).value),e:(E('ee')||{}).value.trim()};
  if(id){
    var idx=-1;for(var i=0;i<S.qs.length;i++){if(S.qs[i].id===parseInt(id)){idx=i;break}}
    if(idx!==-1){for(var k in d)if(d[k]!==undefined)S.qs[idx][k]=d[k]}
  }else{
    var mx=0;for(var j=0;j<S.qs.length;j++)if(S.qs[j].id>mx)mx=S.qs[j].id;
    S.qs.push({id:mx+1,m:d.m,q:d.q,a:d.a,n:d.n,e:d.e})
  }
  sv();clM();sAP();tk('保存成功！','ok')
};
window.dlQ=function(id){if(!confirm('确定删除？'))return;var idx=-1;for(var i=0;i<S.qs.length;i++){if(S.qs[i].id===id){idx=i;break}}if(idx!==-1){S.qs.splice(idx,1);sv();sAP();tk('已删除')}};
window.impQ=function(){
  var ip=document.createElement('input');ip.type='file';ip.accept='.json';
  ip.onchange=function(ev){
    var f=ev.target.files[0];if(!f)return;
    var r=new FileReader();
    r.onload=function(ev2){
      try{
        var d=JSON.parse(ev2.target.result),imp=d.questions||d;
        if(Array.isArray(imp)){
          var ids=S.qs.map(function(x){return x.id}),mx=Math.max.apply(null,[0].concat(ids));
          for(var i=0;i<imp.length;i++){if(ids.indexOf(imp[i].id)===-1){imp[i].id=++mx;S.qs.push(imp[i])}}
          sv();sAP();tk('导入'+imp.length+'道成功！','ok')
        }else{tk('格式错误','err')}
      }catch(err){tk('解析失败','err')}
    };r.readAsText(f)
  };ip.click()
};
window.expQ=function(){

  var b=new Blob([JSON.stringify(d,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');

    '<form onsubmit="return false"><div class="fg"><label>考试标题</label><input type="text" id="ssT" value="'+C.t+'"></div>'+
    '<div class="fg"><label>题目数量</label><input type="number" id="ssN" value="'+C.n+'" min="1" max="100"></div>'+
    '<div class="fg"><label>每题分值</label><input type="number" id="ssP" value="'+C.p+'" min="1"></div>'+
    '<div class="fg"><label>及格分数</label><input type="number" id="ssS" value="'+C.s+'" min="1"></div>'+
    '<button type="button" onclick="svSet()" class="btn btn-p">保存设置</button></form>'+
    '<div style="margin-top:30px;padding-top:30px;border-top:1px solid #e8e8e8"><h3 style="margin-bottom:15px">🔐 修改密码</h3>'+
    '<form onsubmit="return false"><div class="fg"><label>当前密码</label><input type="password" id="soP" required></div>'+
    '<div class="fg"><label>新密码</label><input type="password" id="snP" required></div>'+
    '<div class="fg"><label>确认新密码</label><input type="password" id="scp" required></div>'+
    '<button type="button" onclick="chgPwd()" class="btn btn-d">修改密码</button></form></div></div></div>'
};
window.svSet=function(){
  C.t=(E('ssT')||{}).value||C.t;C.n=parseInt((E('ssN')||{}).value)||C.n;C.p=parseInt((E('ssP')||{}).value)||C.p;C.s=parseInt((E('ssS')||{}).value)||C.s;sv();tk('设置已保存','ok')
};
window.chgPwd=function(){
  var op=(E('soP')||{}).value||'',np=(E('snP')||{}).value||'',cp=(E('scp')||{}).value||'';
  if(op!==C.pw){tk('当前密码错误','err');return}
  if(np!==cp){tk('两次不一致','err');return}
  if(np.length<6){tk('至少6位','err');return}
  C.pw=np;tk('密码已修改','ok');E('soP').value='';E('snP').value='';E('scp').value=''
};

/* 弹窗 */
function opM(){var m=E('qMd');if(m)m.classList.add('show')}
window.clM=function(){var m=E('qMd');if(m)m.classList.remove('show')};

/* 初始化 */
ld();
rt();
})();
</script>
</body>
